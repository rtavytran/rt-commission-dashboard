# RT Commission Dashboard Configuration
# This file contains workspace-specific settings that can be customized

# Workspace/Company Configuration
workspace:
  name: "Dashboard"
  company: "Nagen"
  domain: "rt.local"
  
# Database Configuration  
database:
  type: "sqlite" # options: sqlite, supabase
  filename: "rt_commission_dashboard_v2.db" # for sqlite
  supabase:
    url: "" # set via env var SUPABASE_URL preferred
    key: "" # set via env var SUPABASE_KEY preferred
  
# Commission & Rewards Configuration
commission:
  tiers:
    - {threshold: 0, rate: 0.20}           # > 0: 20%
    - {threshold: 200000000, rate: 0.22}   # > 200M: 22%
    - {threshold: 400000000, rate: 0.25}   # > 400M: 25% 
    - {threshold: 1000000000, rate: 0.30}  # > 1B: 30%
    - {threshold: 2000000000, rate: 0.35}  # > 2B: 35%
  
  role_rates:
    strategic_partner: 0.35 # Fixed rate for Strategic Partner

  max_levels: 10   # Increased specifically for differential depth

# User Roles Configuration
roles:
  admin: 
    label: "Administrator"
    permissions: ["Q1", "Q2", "Q3", "Q4"]
  affiliate:
    label: "Affiliate"  
    permissions: ["Q1", "Q2", "Q3", "Q4"]
  ctv:
    label: "Collaborator"
    permissions: ["Q1", "Q2"]

# Application Configuration
app:
  title: "RT Commission Dashboard"
  port: 8000
  secret_key: "rt_dashboard_secret_key_123"
  theme: "dark"
  currency: "vnd" # options: usd, vnd
  
# Mock Data Configuration (for testing)
mock_data:
  enabled: true
  admin_email: "admin@rt.local"
  sample_domain: "rt.local"