[project]
name = "rt-commission-dashboard"
version = "0.1.0"
description = "Sales & Commission Dashboard"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Antigravity", email = "antigravity@gemini.com"}]
dependencies = [
    "nicegui>=1.4.0",
    "plotly>=5.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "faker>=20.0.0",  # For generating test data in Phase 1
    "pyyaml>=6.0.0"   # For configuration file support
]

[project.scripts]
rt-commission-dashboard = "rt_commission_dashboard.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rt_commission_dashboard"]
